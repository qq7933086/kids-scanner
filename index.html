<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="爸妈陪同的趣味健康扫描仪：扫一扫肚肚、小手、牙齿、眼睛，看看有没有小虫虫，养成卫生好习惯。">
  <meta name="theme-color" content="#FFF7EC">
  <title>健康小卫士扫描仪</title>
  <!-- Stage 6：PWA——manifest + 图标（iOS 添加主屏走 apple-touch-icon） -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小卫士扫描仪">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">

    <!-- 首页：标题 + 家长陪同提示 + 四个部位大按钮 -->
    <section id="view-home" class="view active" aria-label="首页·选择部位">
      <header class="home-head">
        <div class="app-badge" aria-hidden="true">
          <img src="assets/svg/camera.svg" alt="" width="44" height="44">
        </div>
        <h1>健康小卫士扫描仪</h1>
        <p class="subtitle">请爸妈陪同一起玩哦</p>
      </header>

      <nav class="part-grid" aria-label="选择要扫描的部位">
        <button class="part-btn" type="button" data-part="belly">
          <img src="assets/svg/belly/clean-belly.svg" alt="" width="84" height="84">
          <span class="part-name">肚肚</span>
        </button>
        <button class="part-btn" type="button" data-part="hands">
          <img src="assets/svg/hands/clean-hand.svg" alt="" width="84" height="84">
          <span class="part-name">小手</span>
        </button>
        <button class="part-btn" type="button" data-part="teeth">
          <img src="assets/svg/teeth/clean-tooth.svg" alt="" width="84" height="84">
          <span class="part-name">牙齿</span>
        </button>
        <button class="part-btn" type="button" data-part="eyes">
          <img src="assets/svg/eyes/clean-eye.svg" alt="" width="84" height="84">
          <span class="part-name">眼睛</span>
        </button>
      </nav>
    </section>

    <!-- 扫描视图：相机/mock 画面 + 扫描仪式感 + ~4s 计时（Stage 3） -->
    <section id="view-scan" class="view" aria-label="扫描">
      <header class="scan-head">
        <button id="btn-back" class="icon-btn" type="button" aria-label="返回首页">
          <img src="assets/svg/back.svg" alt="" width="26" height="26">
        </button>
        <p id="scan-part" class="part-pill">肚肚</p>
        <!-- Stage 5：静音开关（sound-on/off.svg，localStorage 持久化，初始默认开） -->
        <button id="btn-sound" class="icon-btn" type="button" aria-label="静音" aria-pressed="false">
          <img src="assets/svg/sound-on.svg" alt="" width="26" height="26">
        </button>
      </header>

      <p id="scan-notice" class="scan-notice" hidden aria-live="polite">相机在休息～用卡通模式也能扫！</p>

      <div id="scan-stage" class="scan-stage">
        <video id="cam-video" playsinline muted autoplay></video>
        <canvas id="mock-canvas"></canvas>

        <!-- 扫描仪式感：准星框（assets scan-frame）+ 上下往返扫描线（styles.css） -->
        <div class="scan-overlay" aria-hidden="true">
          <div class="scan-frame-wrap">
            <img src="assets/svg/scan-frame.svg" alt="">
            <div class="scan-line-track"><div class="scan-line"></div></div>
          </div>
        </div>

        <!-- Stage 5：父母面板入口①——右下小齿轮（DESIGN §5，低视觉权重） -->
        <button id="btn-parent" class="gear-btn" type="button" aria-label="爸妈小面板">
          <img src="assets/svg/gear.svg" alt="" width="36" height="36">
        </button>
      </div>

      <!-- 进度换词（DESIGN §4 通用文案：0s/1.5s/3s），app.js 按 ~4s 计时驱动 -->
      <p id="scan-status" class="scan-status" aria-live="polite">正在扫描…别动哦</p>

      <div class="scan-actions">
        <button id="btn-rescan" class="action-btn primary" type="button">重新扫描</button>
        <button id="btn-scan-change" class="action-btn" type="button">换个部位</button>
      </div>

      <!-- Stage 5：父母面板（DESIGN §5）——底部抽屉；打开=停表定格，关闭=续扫 -->
      <div id="parent-overlay" class="parent-overlay" hidden>
        <div class="parent-mask" aria-hidden="true"></div>
        <div class="parent-drawer" role="dialog" aria-modal="true" aria-label="爸妈小面板">
          <h2 class="parent-title">爸妈小面板</h2>
          <div class="parent-options" role="radiogroup" aria-label="选择下一次扫描的结果">
            <input type="radio" name="parent-force" id="pf-found" value="found" class="sr-only">
            <label for="pf-found" class="parent-opt opt-found"><span class="opt-dot" aria-hidden="true"></span>这次发现</label>
            <input type="radio" name="parent-force" id="pf-clean" value="clean" class="sr-only">
            <label for="pf-clean" class="parent-opt opt-clean"><span class="opt-dot" aria-hidden="true"></span>这次干净</label>
            <input type="radio" name="parent-force" id="pf-random" value="random" class="sr-only" checked>
            <label for="pf-random" class="parent-opt opt-random"><span class="opt-dot" aria-hidden="true"></span>随机</label>
          </div>
          <p class="parent-hint">只影响下一次扫描，之后自动回到随机</p>
          <p id="parent-toast" class="parent-toast" hidden aria-live="polite"></p>
          <button id="btn-parent-close" class="action-btn" type="button">收起</button>
        </div>
      </div>
    </section>

    <!-- 结果视图：Stage 4 canvas-art.js 播放 部位×结局 动画 + DESIGN §4 词表文案 -->
    <section id="view-result" class="view" aria-label="扫描结果">
      <div id="result-stage" class="result-stage">
        <!-- 双层：底层定格帧（静态，仅 resize 重绘），顶层卡通动画（RAF 每帧） -->
        <canvas id="result-bg"></canvas>
        <canvas id="result-canvas"></canvas>
      </div>

      <!-- 主文案（大字）+ 副文案：动画主段结束后由 canvas-art.js 揭示 -->
      <div id="result-card" class="result-card" hidden aria-live="polite">
        <h2 id="result-title" class="result-title"></h2>
        <p id="result-sub" class="result-sub"></p>
      </div>

      <div id="result-actions" class="result-actions" hidden>
        <button id="btn-again" class="action-btn primary" type="button">再来一次</button>
        <button id="btn-change" class="action-btn" type="button">换个部位</button>
        <button id="btn-tips" class="action-btn" type="button" aria-expanded="false" aria-controls="result-tips"></button>
      </div>

      <!-- 小妙招：点第三按钮展开的 2–3 条短句（DESIGN §4） -->
      <ul id="result-tips" class="result-tips" hidden></ul>
    </section>

  </main>
  <script src="mock.js"></script>
  <script src="canvas-art.js"></script>
  <script src="audio.js"></script>
  <script src="controls.js"></script>
  <script src="app.js"></script>
  <script>
    /* Stage 6：注册 Service Worker（离线缓存）。http 非 localhost 等非安全
       上下文里 navigator.serviceWorker 不存在，静默跳过不报错。 */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch((err) => console.warn('[sw] 注册失败：', err));
      });
    }
  </script>
</body>
</html>
